<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>OSM Canvas – Варна с Икони и Marker List</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;}
#mapCanvas{width:100%;height:100%;display:block;cursor:grab;background:#ccc;}
#controls{position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.9);border-radius:6px;padding:6px;font-family:sans-serif;font-size:14px;}
#controls button{border:none;background:#4a90e2;color:white;font-size:18px;width:32px;height:32px;margin:2px;border-radius:4px;cursor:pointer;}
#controls button:hover{background:#357ab8;}

#markerList{
    position:absolute;top:10px;right:10px;
    background:rgba(255,255,255,0.95);
    border-radius:6px;padding:6px;
    font-family:sans-serif;font-size:14px;
    max-height:90%;overflow:auto;
}
#markerList button{cursor:pointer;}
#markerList input{font-size:13px;}
</style>
</head>
<body>
<canvas id="mapCanvas"></canvas>

<div id="controls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <span id="coords"></span>
</div>

<div id="markerList"></div>

<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
const coordsDisplay = document.getElementById("coords");
const tileSize = 256;
const TILE_URL = "http://localhost:8080/tile/{z}/{x}/{y}.png";

// Център Варна
let zoom = 13;
let center = {lat:43.2141, lon:27.9147};

// --- Маркери с икона
let markers = [
    {lat:43.2141, lon:27.9147, label:"Варна", iconSrc:"https://cdn-icons-png.flaticon.com/512/684/684908.png"}
];

// Предварително зареждане на икони
markers.forEach(m=>{
    const img = new Image();
    img.src = m.iconSrc;
    m.iconImg = img;
});

const tileCache = new Map();

// --- Lat/Lon ↔ tile coordinates
function lon2x(lon){return (lon+180)/360;}
function lat2y(lat){const rad=lat*Math.PI/180; return (1 - Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2;}
function x2lon(x){return x*360-180;}
function y2lat(y){const n=Math.PI-2*Math.PI*y; return (180/Math.PI)*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));}

// --- Load tile
function getTile(z,x,y){
    const key=`${z}/${x}/${y}`;
    if(tileCache.has(key)) return tileCache.get(key);
    const img=new Image();
    img.onload = ()=>draw();
    img.src=TILE_URL.replace("{z}",z).replace("{x}",x).replace("{y}",y);
    tileCache.set(key,img);
    return img;
}

// --- Draw map с tiles и маркери
let hoveredMarker = null;
function draw(){
    if(!canvas.width || !canvas.height) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const mapSize = Math.pow(2,zoom)*tileSize;
    const centerX = lon2x(center.lon)*mapSize;
    const centerY = lat2y(center.lat)*mapSize;

    const startX = centerX - canvas.width/2;
    const startY = centerY - canvas.height/2;

    const firstTileX = Math.floor(startX/tileSize);
    const firstTileY = Math.floor(startY/tileSize);
    const lastTileX = Math.ceil((startX+canvas.width)/tileSize);
    const lastTileY = Math.ceil((startY+canvas.height)/tileSize);
    const maxTile = Math.pow(2,zoom);

    // Tiles
    for(let x=firstTileX;x<lastTileX;x++){
        for(let y=firstTileY;y<lastTileY;y++){
            if(y<0||y>=maxTile) continue;
            const wrappedX = ((x%maxTile)+maxTile)%maxTile;
            const img=getTile(zoom,wrappedX,y);
            ctx.drawImage(img, x*tileSize-startX, y*tileSize-startY, tileSize, tileSize);
        }
    }

    // Маркери
    markers.forEach(m=>{
        const mX = lon2x(m.lon)*mapSize - startX;
        const mY = lat2y(m.lat)*mapSize - startY;
        if(m.iconImg) ctx.drawImage(m.iconImg, mX-12, mY-24, 24, 24);
    });

    // Tooltip
    if(hoveredMarker){
        const mX = lon2x(hoveredMarker.lon)*mapSize - startX;
        const mY = lat2y(hoveredMarker.lat)*mapSize - startY;
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "black";
        ctx.fillText(hoveredMarker.label, mX + 15, mY - 10);
    }

    coordsDisplay.textContent=`Zoom:${zoom} | Lat:${center.lat.toFixed(5)} | Lon:${center.lon.toFixed(5)}`;
    updateMarkerList(); // обновява списъка с маркери
}

// --- Drag map и markers
let isDragging=false, lastX, lastY, draggingMarker=null, dragOffsetX=0, dragOffsetY=0;
canvas.addEventListener("mousedown", e=>{
    const mapSize = Math.pow(2, zoom) * tileSize;
    const centerX = lon2x(center.lon) * mapSize;
    const centerY = lat2y(center.lat) * mapSize;
    const startX = centerX - canvas.width/2;
    const startY = centerY - canvas.height/2;

    draggingMarker = null;
    markers.forEach(m=>{
        const mX = lon2x(m.lon)*mapSize - startX;
        const mY = lat2y(m.lat)*mapSize - startY;
        if(Math.abs(e.clientX - mX)<12 && Math.abs(e.clientY - mY)<24){
            draggingMarker = m;
            dragOffsetX = e.clientX - mX;
            dragOffsetY = e.clientY - mY;
        }
    });

    if(!draggingMarker){
        isDragging=true; lastX=e.clientX; lastY=e.clientY;
        canvas.style.cursor="grabbing";
    }
});

canvas.addEventListener("mousemove", e=>{
    const mapSize=Math.pow(2,zoom)*tileSize;
    const centerX = lon2x(center.lon)*mapSize;
    const centerY = lat2y(center.lat)*mapSize;
    const startX = centerX - canvas.width/2;
    const startY = centerY - canvas.height/2;

    if(draggingMarker){
        const mX = e.clientX - dragOffsetX;
        const mY = e.clientY - dragOffsetY;
        draggingMarker.lon = x2lon((mX + startX)/mapSize);
        draggingMarker.lat = y2lat((mY + startY)/mapSize);
        draw();
    } else if(isDragging){
        const dx=e.clientX-lastX, dy=e.clientY-lastY;
        moveByPixels(dx, dy);
        lastX=e.clientX; lastY=e.clientY;
    } else {
        // Hover tooltip
        hoveredMarker = null;
        markers.forEach(m=>{
            const mX = lon2x(m.lon)*mapSize - startX;
            const mY = lat2y(m.lat)*mapSize - startY;
            if(Math.abs(e.clientX - mX)<12 && Math.abs(e.clientY - mY)<24){
                hoveredMarker = m;
            }
        });
        draw();
    }
});

canvas.addEventListener("mouseup", ()=>{
    draggingMarker=null;
    isDragging=false;
    canvas.style.cursor="grab";
});
canvas.addEventListener("mouseleave", ()=>{
    draggingMarker=null;
    isDragging=false;
    canvas.style.cursor="grab";
});

// --- Move map
function moveByPixels(dx,dy){
    const mapSize=Math.pow(2,zoom)*tileSize;
    const x=lon2x(center.lon)*mapSize-dx;
    const y=lat2y(center.lat)*mapSize-dy;
    center.lon=x2lon(x/mapSize);
    center.lat=y2lat(y/mapSize);
    draw();
}

// --- Zoom
function setZoom(newZoom){
    if(newZoom<1) newZoom=1;
    if(newZoom>19) newZoom=19;

    const oldMapSize = Math.pow(2,zoom)*tileSize;
    const newMapSize = Math.pow(2,newZoom)*tileSize;
    const scale = newMapSize / oldMapSize;

    const centerX = lon2x(center.lon) * oldMapSize;
    const centerY = lat2y(center.lat) * oldMapSize;
    const newCenterX = centerX * scale;
    const newCenterY = centerY * scale;

    center.lon = x2lon(newCenterX / newMapSize);
    center.lat = y2lat(newCenterY / newMapSize);

    zoom = newZoom;
    draw();
}

// --- Events
window.addEventListener("load", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
});
window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
});
canvas.addEventListener("wheel", e=>{
    e.preventDefault();
    setZoom(zoom + (e.deltaY<0?1:-1));
});
document.getElementById("zoomIn").onclick = ()=>setZoom(zoom+1);
document.getElementById("zoomOut").onclick = ()=>setZoom(zoom-1);

// --- Double-click добавяне на маркер
canvas.addEventListener("dblclick", e=>{
    const mapSize=Math.pow(2,zoom)*tileSize;
    const centerX = lon2x(center.lon)*mapSize;
    const centerY = lat2y(center.lat)*mapSize;
    const startX = centerX - canvas.width/2;
    const startY = centerY - canvas.height/2;

    const clickX = e.clientX + startX;
    const clickY = e.clientY + startY;
    const lat = y2lat(clickY/mapSize);
    const lon = x2lon(clickX/mapSize);

    addMarker(lat, lon, `Point ${markers.length+1}`);
});

// --- Marker list панел
function updateMarkerList(){
    const listDiv = document.getElementById("markerList");
    listDiv.innerHTML="<b>Markers</b><br><br>";

    markers.forEach((m,index)=>{
        const div=document.createElement("div");
        div.style.marginBottom="6px";
        div.style.padding="4px";
        div.style.borderBottom="1px solid #ccc";
        div.innerHTML=`
            <b>${m.label}</b><br>
            Lat: <input type="number" step="0.00001" value="${m.lat.toFixed(5)}" data-index="${index}" class="latInput" style="width:80px;">,
            Lon: <input type="number" step="0.00001" value="${m.lon.toFixed(5)}" data-index="${index}" class="lonInput" style="width:80px;">
            <button data-index="${index}" class="deleteBtn" style="margin-left:4px;">🗑️</button>
        `;
        listDiv.appendChild(div);
    });

    // Delete
    listDiv.querySelectorAll(".deleteBtn").forEach(btn=>{
        btn.onclick=(e)=>{
            const idx=parseInt(e.target.dataset.index);
            markers.splice(idx,1);
            draw();
        };
    });

    // Lat input
    listDiv.querySelectorAll(".latInput").forEach(input=>{
        input.onchange=(e)=>{
            const idx=parseInt(e.target.dataset.index);
            const val=parseFloat(e.target.value);
            if(!isNaN(val)){
                markers[idx].lat=val;
                draw();
            }
        };
    });

    // Lon input
    listDiv.querySelectorAll(".lonInput").forEach(input=>{
        input.onchange=(e)=>{
            const idx=parseInt(e.target.dataset.index);
            const val=parseFloat(e.target.value);
            if(!isNaN(val)){
                markers[idx].lon=val;
                draw();
            }
        };
    });
}

// --- Add marker function
function addMarker(lat,lon,label="New Point"){
    const iconUrl="https://cdn-icons-png.flaticon.com/512/684/684908.png";
    const img=new Image();
    img.src=iconUrl;
    markers.push({lat, lon, label, iconSrc:iconUrl, iconImg:img});
    draw();
}

// Add "Add Marker" button
const addBtn=document.createElement("button");
addBtn.textContent="➕ Add Marker";
addBtn.style.marginTop="6px";
addBtn.onclick=()=>addMarker(center.lat,center.lon,`Point ${markers.length+1}`);
document.getElementById("markerList").appendChild(addBtn);
</script>
</body>
</html>
